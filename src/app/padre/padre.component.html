<!-- ejemplo del decorador @input -->

<!-- [mensaje] va a recibir el valor que tiene la bariable (mensajepadre) y se va a enviar al componente hijo -->
 <!-- esta escrito dentro de la llamada del componente hijo -->


 <!-- <app-hijo [mensaje]="mensajePadre"> </app-hijo> -->


 <div class="container">
    <h3 class="text-primary">Componente padre</h3>
    <app-hijo (notificarpadre)="recibir($event)"></app-hijo>

    @if (mensaje) {
        <p>{{mensaje}}</p>
    }
    
 </div>
